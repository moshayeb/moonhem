# Local PostgreSQL for Moonhem. Match root `.env`:
#   DATABASE_NAME=MoonHem   (or same as POSTGRES_DB below)
#   PASSWORD=postgres       (same as POSTGRES_PASSWORD)
#
# Start: docker compose up -d
# Then: python backend/db_setup.py && python backend/seed.py  (from repo root, with venv)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MoonHem
    ports:
      - "5432:5432"
    volumes:
      - moonhem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MoonHem"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  moonhem_pgdata:
5t